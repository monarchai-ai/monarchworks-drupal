      value: "<p>There's a moment, every few decades, when something that used to require a specialist stops requiring one.</p><p>It happened when publishing a website stopped needing a developer for every change. We think AI is at that moment now. The hard part was never having the idea — the people who run the business are full of ideas. The hard part was getting those ideas into the product without losing them in translation. That's the part Innovate removes.</p>"
