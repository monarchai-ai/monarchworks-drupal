  field_body:
    -
      value: "<p>MonarchWorks was started by people who spent twenty-five years running cloud infrastructure — the systems underneath other companies' software, kept reliable and efficient at scale. From that seat you see the same pattern in every industry: the people who understand the business have the ideas, and a queue of specialists stands between those ideas and the product.</p><p>When AI made it possible to close that gap, most of the industry pointed it at the people instead of the queue — tools handed down from above, hard to direct, easy to lose control of. We started MonarchWorks to build the opposite: AI that the people closest to the work pick up, point, and stay in command of.</p>"
      format: basic_html
