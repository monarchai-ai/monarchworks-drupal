        <h2>Privacy Policy</h2>
        <p>Monarch Works Corporation ("we", "our", or "us") is committed to protecting your privacy. This Privacy Policy explains how we collect, use, and safeguard your information when you use our services.</p>

        <h2>Information We Collect</h2>
        <p>We collect information you provide directly to us, such as when you create an account, use our Services, or contact us for support. This may include:</p>
        <ul>
        <li>Name and contact information</li>
        <li>Account credentials</li>
        <li>Payment information (processed securely by our payment providers)</li>
        <li>Communications with us</li>
        <li>Usage data and analytics</li>
        </ul>

        <h2>How We Use Your Information</h2>
        <p>We use the information we collect to:</p>
        <ul>
        <li>Provide, maintain, and improve our Services</li>
        <li>Process transactions and send related information</li>
        <li>Send technical notices and support messages</li>
        <li>Respond to your comments and questions</li>
        <li>Monitor and analyze usage patterns</li>
        <li>Comply with legal obligations</li>
        </ul>

        <h2>Data Sharing</h2>
        <p>We do not sell, trade, or rent your personal information to third parties. We may share your information with trusted service providers who assist us in operating our Services, subject to confidentiality agreements.</p>

        <h2>Data Security</h2>
        <p>We implement appropriate technical and organizational measures to protect your information against unauthorized access, alteration, disclosure, or destruction.</p>

        <h2>Your Rights</h2>
        <p>Depending on your location, you may have certain rights regarding your personal data, including the right to access, correct, or delete your information. Contact us at legal@monarchworks.ai to exercise these rights.</p>

        <h2>Cookies</h2>
        <p>We use cookies and similar tracking technologies to enhance your experience. You can control cookie settings through your browser.</p>

        <h2>Children's Privacy</h2>
        <p>Our Services are not directed to children under 13. We do not knowingly collect personal information from children.</p>

        <h2>Changes to This Policy</h2>
        <p>We may update this Privacy Policy periodically. We will notify you of significant changes via email or through our Services.</p>

        <h2>Contact Us</h2>
        <p>If you have questions about this Privacy Policy, please contact us at: legal@monarchworks.ai</p>
        <p>Monarch Works Corporation, California, United States</p>
