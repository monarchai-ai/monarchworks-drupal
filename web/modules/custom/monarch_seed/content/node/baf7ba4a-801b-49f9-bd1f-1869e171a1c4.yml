      value: '{"columns":2,"cards":[{"eyebrow":"Embed","title":"It lives inside your product","body":"Your AI service becomes part of the app you already use \u2014 right where your customers are, not one more separate tool to open. Use it just as it comes, or make it match the look of your product, down to the detail."},{"eyebrow":"No queue","title":"The team with the idea makes it real","body":"The people who understand the work set it up and put it live themselves \u2014 no writing up a request, no waiting a quarter, no watching the idea lose its shape as it passes from hand to hand."},{"eyebrow":"Right-sized AI","title":"Smart where it matters, lean where it doesn''t","body":"Innovate uses the most capable AI for the parts that need it, and something lighter for the parts that don''t. You get quality where it counts and a bill that makes sense."},{"eyebrow":"Costs, capped","title":"Production-ready, with a cap you set","body":"See exactly what it''s doing and what it costs, and set a spending limit before it runs even once — the hard operational work is already handled."}]}'
