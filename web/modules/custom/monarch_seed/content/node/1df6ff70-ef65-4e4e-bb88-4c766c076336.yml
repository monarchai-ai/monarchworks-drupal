  field_section_data:
    -
      value: '{"intro":"Enterprise agent platforms are built to govern many agents across a whole organization. Innovate is built to get one AI service into one product, fast \u2014 and to keep it visible and controlled once it''s there. The enterprise control planes are powerful and thorough. They are also heavy: owned by IT, governance-first, often tied to a single cloud ecosystem.","headers":["","Enterprise agent platforms","Innovate"],"rows":[["Built for","Governing many agents org-wide","Embedding one service in your product"],["Owned by","IT \/ platform teams","The team that owns the problem"],["Time to first live service","Weeks to months","An afternoon"],["Approach","Governance-first","Ship-first, with control built in"],["Ecosystem","Often tied to one cloud","Runs alongside what you already use"],["Best when","You''re coordinating agents at scale","You need a specific service live now"]],"callout":{"title":"When an enterprise platform is the better choice","body":"If your job is to coordinate and govern many agents across many departments, with central policy and fleet-wide oversight as the primary need, an enterprise control plane is built for exactly that. Innovate is the better choice when the goal is a specific service, in a specific product, live quickly."}}'
