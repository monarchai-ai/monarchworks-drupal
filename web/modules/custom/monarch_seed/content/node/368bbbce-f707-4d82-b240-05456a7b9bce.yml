  field_body:
    -
      value: "<p>Under the surface, the pieces have names. Here's the real model.</p><h3>Agents</h3><p>Each agent has a purpose, the AI behind it, its instructions, and any tools or data it can reach.</p><h3>Collaboration</h3><p>One agent or several are arranged into a collaboration that controls how they hand off and share information. This arrangement is captured in a configuration — a <code>collaborationConfig</code>.</p><h3>Service</h3><p>The collaboration is deployed as a service with a <code>REST API</code> and <code>OpenAPI</code> schemas, so your own software can call it. One configuration can power more than one service.</p><h3>Running it</h3><p>Every call is recorded in a full <code>execution journal</code> — each step, what it produced, and what it cost. Usage is metered per service, and spending caps apply from the first call.</p>"
      format: basic_html
