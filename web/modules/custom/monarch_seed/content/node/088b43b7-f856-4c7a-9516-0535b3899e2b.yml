  field_section_data:
    -
      value: '{"rotateMs":5000,"ctaNote":"Available now","slides":[{"heading":"You describe it. <span class=\"mark\">Innovate builds it.</span>","lede":"The person who knows the work best describes the AI service they need, and Innovate builds it complete. Your engineers add it to your product once — from then on, the expert updates it in place. No engineering queue for changes, nothing lost in translation."},{"heading":"From bright idea to <span class=\"mark\">live in your product</span>.","lede":"Describe the service in plain language and test it against cases you already know the answers to. Your engineers wire it in once — then every improvement you make lands in place, with no release cycle and no waiting."},{"heading":"AI that lives in <span class=\"mark\">your product</span> — not on another platform.","lede":"Most AI tools make everyone come to them. Innovate runs real AI services behind your UI and inside your systems — one smart agent or a whole team of them, invisible to everyone but you."},{"heading":"If you can describe the work, <span class=\"mark\">you can run the AI</span>.","lede":"Innovate turns what''s in your head into a working AI service. Once it''s in your product, it''s yours to manage — what it does, how it changes, what it spends — with every update landing in place, no engineering required."},{"heading":"Everyone has an AI demo. <span class=\"mark\">You''ll have it in production.</span>","lede":"Most AI projects stall between the prototype and the product. Innovate closes that gap: services built production-grade from day one, integrated once by your engineers, improved in place by your experts — every run and every dollar in plain view."},{"heading":"AI simple enough to start. <span class=\"mark\">Controlled enough to trust.</span>","lede":"Spend caps from day one. Per-service costs you can see at a glance. Every result inspectable. Innovate makes AI easy to say yes to — and easy to stand behind."},{"heading":"The AI features your customers want are <span class=\"mark\">one description away</span>.","lede":"Your roadmap is full and your team is booked. Describe the feature and Innovate builds it complete — your engineers wire it in once, and every improvement after that ships in place. This quarter, not three roadmaps from now."},{"heading":"All product. <span class=\"mark\">No plumbing.</span>","lede":"Innovate runs the hosting, monitoring, scaling, and cost tracking so you never build any of it. You bring the idea and the judgment — the infrastructure is already done."},{"heading":"Put your best people <span class=\"mark\">in charge of the AI</span>.","lede":"The people closest to the work know exactly what it should do. Innovate hands them the controls: build from a description, see every result, tune it as the work changes — live in your product the whole time."},{"heading":"Real AI. <span class=\"mark\">Really yours.</span>","lede":"Described by your experts, embedded in your product, managed by your team, capped at your budget. Innovate is AI as a service — with the service answering to you."}]}'
