      value: '{"groups":[{"title":"The basics","items":[{"q":"What is Innovate?","a":"Innovate is a platform for building and deploying AI services that embed in your own product. You describe what you need; Innovate builds an AI service \u2014 a single agent or a coordinated team of agents \u2014 and deploys it as a REST API that runs inside the app you already use."},{"q":"Do I need to know how to code?","a":"No. Innovate is a fully visual, no-code environment \u2014 you describe the outcome you want and Innovate builds the service. Developers can work with the underlying API directly if they want to, but it isn''t required."},{"q":"What can I build with it?","a":"Anything that takes information in and sends a useful result back: triaging and routing incoming requests, summarizing long documents, classifying and tagging data, answering questions against your own policies, and multi-step tasks handled by several agents working together."},{"q":"Where does the AI service actually run?","a":"The service is deployed as a REST API. Your own product calls it, so the AI runs inside the app your team already uses rather than in a separate tool they have to open."}]},{"title":"How it works","items":[{"q":"What is a single-agent vs. multi-agent service?","a":"A single-agent service uses one AI agent to handle a task. A multi-agent service coordinates several agents that hand off to each other. In Innovate, a whole multi-agent collaboration is deployed behind one service and called as one API."},{"q":"How does Innovate keep costs under control?","a":"It uses the most capable AI only for the parts of a task that need it, and lighter models for the parts that don''t. Every service has usage and cost metering, and you can set a spending cap before it runs once."},{"q":"Is it suitable for production use?","a":"Yes. Every run is logged with a full record of what happened, costs are metered per service, and spending caps and rate limits apply from the first call."},{"q":"What does it integrate with?","a":"Because each service is a standard REST API, it connects to anything that can call an API \u2014 your own product''s frontend and backend, and your existing tools."}]},{"title":"Buying & comparison","items":[{"q":"How is Innovate different from no-code agent builders?","a":"No-code agent builders create standalone agents that live inside their own platform. Innovate builds an AI service that embeds inside your own product, deployed as a REST API your software calls. Their agent is something people visit; Innovate''s service is something your product runs."},{"q":"How is it different from enterprise platforms?","a":"Those are IT-owned control planes built to govern many agents across an organization \u2014 powerful, thorough, and heavy. Innovate is a self-serve platform for getting one AI service into one product quickly, with cost control and visibility built in."},{"q":"How much does it cost?","a":"Innovate is self-serve \u2014 plans start at $99\/mo. Each plan is a flat monthly price that includes a number of live services; additional services add a flat monthly fee, and the AI usage your services consume is billed on top at cost plus 25%, with a spending cap you control. There''s no long-term commitment, and your spending cap applies from the first call."},{"q":"Who is Innovate for?","a":"The people closest to the work: those who run a process day to day, product managers adding AI features, founders shipping the core of their product, agencies launching AI for clients, and enterprise teams giving every group a safe way to go live."}]}]}'
